name: Flutter CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_call:
    inputs:
      skip_debug_build:
        description: 'Lewati build APK debug (dipakai workflow rilis yang sudah build sendiri)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'  # samakan dengan versi lokal; naikkan sengaja, bukan otomatis
  MIN_COVERAGE: '50'         # persen baris, tanpa file generated (*.g.dart, firebase_options.dart)

jobs:
  test:
    name: Lint, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Use Placeholder Firebase Config
        run: |
          [ -f lib/firebase_options.dart ] || cp lib/firebase_options.dart.example lib/firebase_options.dart

      - name: Install Dependencies (lockfile wajib cocok)
        run: flutter pub get --enforce-lockfile

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test backend

      - name: Static Analysis (info pun dianggap gagal)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Backend Self-Check
        run: dart run backend/server.dart --self-check

      - name: Verify Drift Code Generation
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib/

      - name: Run Tests
        run: flutter test --coverage

      - name: Enforce Minimum Coverage
        run: |
          read -r hit total pct < <(awk -F: '
            /^SF:/ { skip = ($2 ~ /\.g\.dart$|firebase_options\.dart$/) }
            !skip && /^LH:/ { h += $2 }
            !skip && /^LF:/ { t += $2 }
            END { printf "%d %d %.1f\n", h, t, (t ? h * 100 / t : 0) }
          ' coverage/lcov.info)
          echo "### Coverage: ${pct}% (${hit}/${total} baris, minimum ${MIN_COVERAGE}%)" >> "$GITHUB_STEP_SUMMARY"
          if ! awk -v p="$pct" -v m="$MIN_COVERAGE" 'BEGIN { exit !(p + 0 >= m + 0) }'; then
            echo "::error::Coverage ${pct}% di bawah minimum ${MIN_COVERAGE}%"; exit 1
          fi

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  build-android:
    name: Build Android (debug APK)
    if: ${{ !inputs.skip_debug_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Use Placeholder Firebase Config
        run: |
          cp android/app/google-services.json.example android/app/google-services.json
          cp lib/firebase_options.dart.example lib/firebase_options.dart

      - name: Install Dependencies (lockfile wajib cocok)
        run: flutter pub get --enforce-lockfile

      - name: Build Debug APK
        run: flutter build apk --debug --dart-define-from-file=config/android.json

      - name: Upload Debug APK (untuk dicoba reviewer)
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code (full history for secret scan)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secret Scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Vulnerability Scan (OSV, pubspec.lock)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=pubspec.lock

      - name: Forbid Committed Secrets & Signing Files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(google-services\.json|GoogleService-Info\.plist|firebase_options\.dart|key\.properties)$|\.(jks|keystore|p12|pem)$|(^|/)\.env$' || true)
          if [ -n "$bad" ]; then
            echo "::error::File rahasia ter-commit:"; echo "$bad"; exit 1
          fi

      - name: Release Manifest Must Be HTTPS-only
        run: |
          m=android/app/src/main/AndroidManifest.xml
          if grep -q 'usesCleartextTraffic="true"' "$m"; then
            echo "::error::$m mengizinkan cleartext HTTP di release"; exit 1
          fi
          if grep -q 'android:debuggable="true"' "$m"; then
            echo "::error::$m menyalakan debuggable"; exit 1
          fi
