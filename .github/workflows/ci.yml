name: Flutter CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'  # samakan dengan versi lokal; naikkan sengaja, bukan otomatis
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Ensure Firebase Config Exists (placeholder for CI)
        run: |
          if [ ! -f "android/app/google-services.json" ] && [ -f "android/app/google-services.json.example" ]; then
            echo "Copying google-services.json.example for CI build..."
            cp android/app/google-services.json.example android/app/google-services.json
          fi
          if [ ! -f "lib/firebase_options.dart" ]; then
            echo "Copying firebase_options.dart.example for CI build..."
            cp lib/firebase_options.dart.example lib/firebase_options.dart
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test backend

      - name: Static Analysis
        run: flutter analyze

      - name: Backend Self-Check
        run: dart run backend/server.dart --self-check

      - name: Verify Drift Code Generation
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib/

      - name: Run Tests
        run: flutter test --coverage

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Vulnerability Scan (OSV, pubspec.lock)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=pubspec.lock

      - name: Forbid Committed Secrets & Signing Files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(google-services\.json|GoogleService-Info\.plist|firebase_options\.dart|key\.properties)$|\.(jks|keystore|p12|pem)$|(^|/)\.env$' || true)
          if [ -n "$bad" ]; then
            echo "::error::File rahasia ter-commit:"; echo "$bad"; exit 1
          fi

      - name: Release Manifest Must Be HTTPS-only
        run: |
          m=android/app/src/main/AndroidManifest.xml
          if grep -q 'usesCleartextTraffic="true"' "$m"; then
            echo "::error::$m mengizinkan cleartext HTTP di release"; exit 1
          fi
          if grep -q 'android:debuggable="true"' "$m"; then
            echo "::error::$m menyalakan debuggable"; exit 1
          fi
