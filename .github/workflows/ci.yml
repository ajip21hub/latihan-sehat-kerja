name: Flutter CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Ensure Google Services Config Exists (Android)
        run: |
          if [ ! -f "android/app/google-services.json" ] && [ -f "android/app/google-services.json.example" ]; then
            echo "Copying google-services.json.example for CI build..."
            cp android/app/google-services.json.example android/app/google-services.json
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: flutter analyze

      - name: Backend Self-Check
        run: dart run backend/server.dart --self-check

      - name: Verify Drift Code Generation
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib/

      - name: Run Tests
        run: flutter test --coverage

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore
